<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My University Notes</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #dedede;
  padding: 15px 25px 0;
  border-bottom: 1px solid #ccc;
}

.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.top h2 { font-size:17px; margin:0; }

.tabs {
  display:flex;
  gap:5px;
  overflow-x:auto;
}

.tab {
  border:0;
  background:#d0d0d0;
  padding:12px 18px;
  border-radius:8px 8px 0 0;
  cursor:pointer;
  white-space:nowrap;
  color:#444;
}

.tab.active {
  background:#fff;
  color:#111;
  font-weight:bold;
}

button { cursor:pointer; }

.add-tab {
  border:0;
  background:transparent;
  font-size:22px;
  padding:5px 12px;
}

main {
  max-width:950px;
  margin:35px auto;
  padding:0 20px 50px;
}

h1 { font-size:25px; margin-bottom:8px; }

.sub {
  color:#888;
  font-size:13px;
  margin-bottom:25px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:30px;
}

.stat {
  background:white;
  padding:18px;
  border:1px solid #e7e7e7;
  border-radius:10px;
}

.stat strong {
  font-size:25px;
  display:block;
}

.stat span {
  color:#888;
  font-size:12px;
}

.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 15px;
}

.section-title h3 { font-size:16px; margin:0; }

.add-btn {
  background:#222;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:7px;
}

.task {
  background:white;
  padding:17px;
  border:1px solid #e8e8e8;
  border-radius:9px;
  margin-bottom:10px;
  display:flex;
  gap:13px;
  align-items:flex-start;
}

.task input { margin-top:5px; }

.notice-mark {
  color:#e53935;
  font-weight:normal;
  font-size:16px;
  line-height:1.2;
  margin-top:1px;
  user-select:none;
}

.task-content {
  flex:1;
  min-width:0;
}

.task-title {
  font-weight:bold;
  margin-bottom:7px;
}

.task-desc {
  font-size:13px;
  color:#777;
  white-space:pre-wrap;
}

.task-meta {
  display:flex;
  gap:10px;
  margin-top:10px;
  font-size:12px;
  color:#888;
  flex-wrap:wrap;
}

.tag {
  background:#f0f0f0;
  padding:4px 8px;
  border-radius:4px;
}

.tag.notice {
  background:#222;
  color:#fff;
  font-weight:bold;
}

.done .task-title {
  text-decoration:line-through;
  color:#aaa;
}

.delete {
  border:0;
  background:transparent;
  color:#aaa;
  font-size:17px;
}

.form {
  background:white;
  padding:20px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:20px;
  display:none;
}

.form input,
.form textarea,
.form select {
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:6px;
  font:inherit;
}

.form textarea {
  min-height:85px;
  resize:vertical;
}

.form label {
  font-size:12px;
  color:#777;
}

.form-actions {
  display:flex;
  gap:8px;
  justify-content:flex-end;
}

.form-actions button {
  padding:10px 18px;
  border-radius:6px;
  border:1px solid #ddd;
}

.empty {
  color:#aaa;
  text-align:center;
  padding:35px 10px;
  background:white;
  border:1px solid #eee;
  border-radius:9px;
  font-size:13px;
}

@media(max-width:600px) {
  main { margin:22px auto; }
  .stats { gap:7px; }
  .stat { padding:12px; }
  .stat strong { font-size:21px; }
  .tab { padding:11px 13px; }
}

.auth-screen {
  position:fixed;
  inset:0;
  background:#f5f5f5;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-card {
  width:100%;
  max-width:380px;
  background:#fff;
  border:1px solid #ddd;
  padding:25px;
  border-radius:10px;
}

.auth-card h2 {
  margin:0 0 8px;
  font-size:22px;
}

.auth-card p {
  font-size:13px;
  line-height:1.6;
  color:#666;
}

.auth-card input {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #aaa;
  border-radius:6px;
  font-size:15px;
}

.auth-actions {
  display:flex;
  gap:8px;
  margin-top:10px;
}

.auth-actions button {
  flex:1;
}

.auth-error {
  color:#b00020!important;
  font-size:12px;
  min-height:18px;
  overflow-wrap:anywhere;
}

.sync-bar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  color:#666;
  margin-bottom:15px;
}

.sync-bar button {
  background:#fff;
  border:1px solid #aaa;
  border-radius:4px;
  padding:5px 8px;
  font-size:11px;
}

[hidden] {
  display:none!important;
}
</style>
</head>

<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">

    <h2>📒 MY UNIVERSITY</h2>

    <p>
      같은 이메일 계정으로 로그인하면 과목과 일정이
      여러 기기에서 자동으로 동기화됩니다.
    </p>

    <input
      id="authEmail"
      type="email"
      placeholder="이메일"
      autocomplete="username"
    >

    <input
      id="authPassword"
      type="password"
      placeholder="비밀번호 (6자 이상)"
      autocomplete="current-password"
    >

    <div class="auth-actions">
      <button class="add-btn" id="loginBtn" type="button">
        로그인
      </button>

      <button id="registerBtn" type="button">
        회원가입
      </button>
    </div>

    <p id="authError" class="auth-error" role="alert"></p>

    <p>
      처음 사용하는 경우 회원가입 후 로그인해 주세요.
    </p>

  </div>
</div>


<div id="appContainer" hidden>

<header>
  <div class="top">
    <h2>📒 MY UNIVERSITY</h2>
    <span style="font-size:12px;color:#777">
      MY STUDY SPACE
    </span>
  </div>

  <div class="tabs" id="tabs"></div>
</header>


<main>

  <div class="sync-bar">
    <span id="syncStatus">● 로그인 대기</span>

    <span>
      <button id="importLocalBtn" type="button" hidden>
        이 기기의 기존 일정 가져오기
      </button>

      <button id="logoutBtn" type="button">
        로그아웃
      </button>
    </span>
  </div>


  <h1 id="pageTitle">오늘 해야 하는 일정</h1>

  <div class="sub" id="subtitle">
    나의 대학 생활을 한눈에 관리하기
  </div>


  <div class="stats">

    <div class="stat">
      <strong id="todoCount">0</strong>
      <span>남은 일정</span>
    </div>

    <div class="stat">
      <strong id="weekCount">0</strong>
      <span>이번 주 일정</span>
    </div>

    <div class="stat">
      <strong id="doneCount">0</strong>
      <span>완료한 일정</span>
    </div>

  </div>


  <div class="form" id="form">

    <h3>새 일정 기록하기</h3>

    <label>제목</label>
    <input
      id="title"
      placeholder="예: 중간고사 과제 제출"
    >

    <label>내용 / 메모</label>
    <textarea
      id="description"
      placeholder="해야 할 일, 교수님 공지, 시험 범위 등을 기록하세요."
    ></textarea>

    <label>일정 종류</label>
    <select id="type">
      <option>과제</option>
      <option>시험</option>
      <option>공지</option>
      <option>개인 할 일</option>
      <option>기타</option>
    </select>

    <label>날짜</label>
    <input type="date" id="date">

    <div class="form-actions">
      <button onclick="closeForm()">
        취소
      </button>

      <button class="add-btn" onclick="saveTask()">
        저장하기
      </button>
    </div>

  </div>


  <!-- 1. 오늘 일정 / 과목별 일정 -->
  <div class="section-title">

    <h3 id="listTitle">오늘의 일정 목록</h3>

    <button class="add-btn" onclick="openForm()">
      ＋ 일정 추가
    </button>

  </div>

  <div id="taskList"></div>


  <!-- 2. 공지사항 (오늘 할 일과 다가오는 일정 사이 배치) -->
  <div id="noticeSection" hidden>
    <div class="section-title" style="margin-top:42px;">
      <h3>공지사항</h3>
      <span style="font-size:12px;color:#888;">전체 과목 공지</span>
    </div>
    <div id="noticeList"></div>
  </div>


  <!-- 3. 다가오는 일정 -->
  <div id="upcomingSection" hidden>
    <div class="section-title" style="margin-top:42px;">
      <h3>다가오는 일정</h3>
      <span style="font-size:12px;color:#888;">이번 주 예정</span>
    </div>
    <div id="upcomingList"></div>
  </div>

</main>
</div>


<script>

const defaultSubjects = [
  "인적 자원 관리",
  "소비자 행동",
  "회계원리",
  "핀테크 개론"
];

let data;

try {
  data = JSON.parse(localStorage.getItem("universityNotes")) || {
    subjects: defaultSubjects,
    tasks: []
  };
} catch(e) {
  data = {
    subjects: defaultSubjects,
    tasks: []
  };
}

let current = "전체 일정";


function saveData() {
  localStorage.setItem(
    "universityNotes",
    JSON.stringify(data)
  );

  if (window.cloudSave) {
    window.cloudSave();
  }
}


function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";

  ["전체 일정", ...data.subjects].forEach(subject => {
    const btn = document.createElement("button");
    btn.className = "tab" + (current === subject ? " active" : "");
    btn.textContent = subject;
    btn.onclick = () => {
      current = subject;
      render();
    };
    tabs.appendChild(btn);
  });

  const add = document.createElement("button");
  add.className = "add-tab";
  add.textContent = "+";
  add.title = "과목 추가";
  add.onclick = addSubject;
  tabs.appendChild(add);
}


function addSubject() {
  const name = prompt("추가할 과목명을 입력하세요.");
  if (!name || !name.trim()) return;

  if (data.subjects.includes(name.trim())) {
    alert("이미 등록된 과목입니다.");
    return;
  }

  data.subjects.push(name.trim());
  saveData();
  current = name.trim();
  render();
}


function openForm() {
  document.getElementById("form").style.display = "block";
  document.getElementById("title").focus();
}


function closeForm() {
  document.getElementById("form").style.display = "none";
}


function saveTask() {
  const title = document.getElementById("title").value.trim();

  if (!title) {
    alert("제목을 입력해주세요.");
    return;
  }

  if (current === "전체 일정") {
    alert("먼저 과목 탭을 선택해주세요.");
    return;
  }

  data.tasks.push({
    id: Date.now(),
    subject: current,
    title,
    description: document.getElementById("description").value,
    type: document.getElementById("type").value,
    date: document.getElementById("date").value,
    done: false
  });

  saveData();

  document.getElementById("title").value = "";
  document.getElementById("description").value = "";
  document.getElementById("date").value = "";

  closeForm();
  render();
}


function toggleTask(id) {
  const task = data.tasks.find(t => t.id === id);
  if (task) {
    task.done = !task.done;
  }
  saveData();
  render();
}


function deleteTask(id) {
  if (!confirm("이 일정을 삭제할까요?")) return;
  data.tasks = data.tasks.filter(t => t.id !== id);
  saveData();
  render();
}


function getTodayStr() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}


function createTaskCard(task, showSubject) {
  const item = document.createElement("div");
  item.className = "task" + (task.done ? " done" : "");

  if (task.type === "공지") {
    const mark = document.createElement("span");
    mark.className = "notice-mark";
    mark.textContent = "!";
    item.appendChild(mark);
  }

  const check = document.createElement("input");
  check.type = "checkbox";
  check.checked = task.done;
  check.onchange = () => toggleTask(task.id);

  const content = document.createElement("div");
  content.className = "task-content";

  const title = document.createElement("div");
  title.className = "task-title";
  title.textContent = task.title;

  const desc = document.createElement("div");
  desc.className = "task-desc";
  desc.textContent = task.description;

  const meta = document.createElement("div");
  meta.className = "task-meta";

  const tag = document.createElement("span");
  tag.className = "tag" + (task.type === "공지" ? " notice" : "");
  tag.textContent = task.type;
  meta.appendChild(tag);

  if (showSubject) {
    const subject = document.createElement("span");
    subject.textContent = task.subject;
    meta.appendChild(subject);
  }

  if (task.date) {
    const date = document.createElement("span");
    date.textContent = "📅 " + task.date;
    meta.appendChild(date);
  }

  content.append(title, desc, meta);

  const del = document.createElement("button");
  del.className = "delete";
  del.textContent = "×";
  del.title = "삭제";
  del.onclick = () => deleteTask(task.id);

  item.append(check, content, del);
  return item;
}


function render() {
  renderTabs();

  const todayStr = getTodayStr();

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + 7);

  const isAllTab = current === "전체 일정";

  const displayTasks = isAllTab
    ? data.tasks.filter(t => t.date === todayStr && t.type !== "공지")
    : data.tasks.filter(t => t.subject === current);

  const statsBase = isAllTab ? data.tasks : displayTasks;

  const sorted = [...displayTasks].sort((a, b) => {
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  const pending = statsBase.filter(t => !t.done);

  document.getElementById("todoCount").textContent = pending.length;
  document.getElementById("doneCount").textContent = statsBase.filter(t => t.done).length;
  document.getElementById("weekCount").textContent = pending.filter(t => {
    if (!t.date) return false;
    const d = new Date(t.date + "T00:00:00");
    return d >= today && d <= weekEnd;
  }).length;

  document.getElementById("pageTitle").textContent =
    isAllTab ? "오늘 해야 하는 일정" : current;

  document.getElementById("subtitle").textContent =
    isAllTab
      ? todayStr + " 기준 오늘 마감되는 일정입니다."
      : current + " 관련 과제와 일정을 기록하세요.";

  document.getElementById("listTitle").textContent =
    isAllTab ? "오늘의 일정 목록" : "과목 일정 및 메모";

  const list = document.getElementById("taskList");
  list.innerHTML = "";

  if (!sorted.length) {
    list.innerHTML = isAllTab
      ? '<div class="empty">오늘 해야 하는 일정이 없습니다. 🎉</div>'
      : '<div class="empty">아직 기록된 일정이 없습니다.<br>＋ 일정 추가를 눌러 첫 기록을 남겨보세요.</div>';
  } else {
    sorted.forEach(task => {
      list.appendChild(createTaskCard(task, isAllTab));
    });
  }

  const noticeSection = document.getElementById("noticeSection");
  const noticeList = document.getElementById("noticeList");
  const upcomingSection = document.getElementById("upcomingSection");
  const upcomingList = document.getElementById("upcomingList");

  if (isAllTab) {
    noticeSection.hidden = false;
    noticeList.innerHTML = "";

    const notices = data.tasks
      .filter(t => t.type === "공지")
      .sort((a, b) => {
        if (!a.date && !b.date) return b.id - a.id;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return b.date.localeCompare(a.date);
      });

    if (!notices.length) {
      noticeList.innerHTML = '<div class="empty">등록된 공지사항이 없습니다.</div>';
    } else {
      notices.forEach(task => {
        noticeList.appendChild(createTaskCard(task, true));
      });
    }

    upcomingSection.hidden = false;
    upcomingList.innerHTML = "";

    const upcomingTasks = data.tasks
      .filter(t => {
        if (t.type === "공지") return false;
        if (!t.date || t.date === todayStr) return false;
        const d = new Date(t.date + "T00:00:00");
        return d > today && d <= weekEnd;
      })
      .sort((a, b) => a.date.localeCompare(b.date));

    if (!upcomingTasks.length) {
      upcomingList.innerHTML = '<div class="empty">이번 주에 다가오는 일정이 없습니다.</div>';
    } else {
      upcomingTasks.forEach(task => {
        upcomingList.appendChild(createTaskCard(task, true));
      });
    }
  } else {
    noticeSection.hidden = true;
    upcomingSection.hidden = true;
  }
}

render();

</script>

    .catch(() => {})
    .then(async () => {
      if (uid !== activeUid) return;
      await setDoc(cloudDoc(uid), {
        data: payload,
        updatedAt: serverTimestamp()
      });
    });

  try {
    await writeQueue;
    if (uid === activeUid && !dirty) {
      setStatus("● 클라우드 저장 완료");
    }
  } catch (error) {
    if (uid === activeUid) {
      dirty = true;
      setStatus("● 저장 실패 — 인터넷 연결을 확인해 주세요");
      console.error(error);
    }
  }
}

function applyRemote(remoteData) {
  if (!remoteData || !Array.isArray(remoteData.subjects) || !Array.isArray(remoteData.tasks)) {
    return;
  }

  data = {
    subjects: remoteData.subjects,
    tasks: remoteData.tasks
  };

  try {
    localStorage.setItem("universityNotes", JSON.stringify(data));
  } catch (error) {
    console.warn("이 기기의 로컬 저장에 실패했습니다.", error);
  }

  render();
}

async function startSession(user) {
  activeUid = user.uid;
  ready = false;
  dirty = false;
  window.cloudSave = null;

  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }
  clearTimeout(writeTimer);

  authScreen.hidden = true;
  appContainer.hidden = false;
  setStatus("● 클라우드 연결 중…");

  const ref = cloudDoc(user.uid);

  try {
    const snapshot = await getDoc(ref);
    if (activeUid !== user.uid) return;

    if (snapshot.exists() && snapshot.data()?.data) {
      applyRemote(snapshot.data().data);
      importLocalBtn.hidden = !hasLocalContent(localBeforeLogin);
    } else {
      const initial = hasLocalContent(localBeforeLogin)
        ? localBeforeLogin
        : {
            subjects: [...defaultSubjects],
            tasks: []
          };

      applyRemote(initial);

      await setDoc(ref, {
        data: initial,
        updatedAt: serverTimestamp()
      });

      importLocalBtn.hidden = true;
    }

    if (activeUid !== user.uid) return;

    ready = true;
    window.cloudSave = queueCloudSave;

    unsubscribe = onSnapshot(
      ref,
      remoteSnapshot => {
        if (!remoteSnapshot.exists()) return;
        if (remoteSnapshot.metadata.hasPendingWrites || dirty) return;

        const remote = remoteSnapshot.data()?.data;
        if (remote) {
          applyRemote(remote);
          setStatus("● 실시간 동기화 연결됨");
        }
      },
      error => {
        setStatus("● 동기화 오류");
        console.error(error);
      }
    );

    setStatus("● 실시간 동기화 연결됨");

  } catch (error) {
    setStatus("● 연결 실패");
    authError.textContent = showError(error);
    authScreen.hidden = false;
    appContainer.hidden = true;
    console.error(error);
  }
}

function stopSession() {
  clearTimeout(writeTimer);
  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  ready = false;
  dirty = false;
  activeUid = null;
  window.cloudSave = null;

  appContainer.hidden = true;
  authScreen.hidden = false;
  importLocalBtn.hidden = true;
  setStatus("● 로그인 대기");
}

async function authAction(register) {
  authError.textContent = "";
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    authError.textContent = "이메일과 비밀번호를 입력해 주세요.";
    return;
  }

  loginBtn.disabled = true;
  registerBtn.disabled = true;

  try {
    if (register) {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (error) {
    authError.textContent = showError(error);
  } finally {
    loginBtn.disabled = false;
    registerBtn.disabled = false;
  }
}

loginBtn.addEventListener("click", () => {
  authAction(false);
});

registerBtn.addEventListener("click", () => {
  authAction(true);
});

passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    authAction(false);
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  if (dirty) {
    await flushCloudSave();
  }
  try {
    await signOut(auth);
  } catch (error) {
    alert(showError(error));
  }
});

importLocalBtn.addEventListener("click", () => {
  if (!confirm("이 기기에 원래 저장되어 있던 과목과 일정을 클라우드 데이터로 덮어쓸까요? 다른 기기에도 이 내용이 적용됩니다.")) {
    return;
  }

  applyRemote(localBeforeLogin);
  queueCloudSave();
  importLocalBtn.hidden = true;
});

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  store = getFirestore(app);

  await setPersistence(auth, browserLocalPersistence);

  onAuthStateChanged(auth, user => {
    if (user) {
      startSession(user);
    } else {
      stopSession();
    }
  });
} catch (error) {
  authError.textContent = showError(error);
  console.error(error);
}

</script>

</body>
</html>
