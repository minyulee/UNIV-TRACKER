
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My University Notes</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f5f5f5;
  color: #222;
}
header {
  background: #dedede;
  padding: 15px 25px 0;
  border-bottom: 1px solid #ccc;
}
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.top h2 { font-size:17px; margin:0; }
.tabs {
  display:flex;
  gap:5px;
  overflow-x:auto;
}
.tab {
  border:0;
  background:#d0d0d0;
  padding:12px 18px;
  border-radius:8px 8px 0 0;
  cursor:pointer;
  white-space:nowrap;
  color:#444;
}
.tab.active {
  background:#fff;
  color:#111;
  font-weight:bold;
}
button { cursor:pointer; }
.add-tab {
  border:0;
  background:transparent;
  font-size:22px;
  padding:5px 12px;
}
main {
  max-width:950px;
  margin:35px auto;
  padding:0 20px;
}
h1 { font-size:25px; margin-bottom:8px; }
.sub { color:#888; font-size:13px; margin-bottom:25px; }
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:30px;
}
.stat {
  background:white;
  padding:18px;
  border:1px solid #e7e7e7;
  border-radius:10px;
}
.stat strong { font-size:25px; display:block; }
.stat span { color:#888; font-size:12px; }
.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 15px;
}
.section-title h3 { font-size:16px; }
.add-btn {
  background:#222;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:7px;
}
.task {
  background:white;
  padding:17px;
  border:1px solid #e8e8e8;
  border-radius:9px;
  margin-bottom:10px;
  display:flex;
  gap:13px;
  align-items:flex-start;
}
.task input { margin-top:5px; }
.task-content { flex:1; min-width:0; }
.task-title { font-weight:bold; margin-bottom:7px; }
.task-desc { font-size:13px; color:#777; white-space:pre-wrap; }
.task-meta {
  display:flex;
  gap:10px;
  margin-top:10px;
  font-size:12px;
  color:#888;
  flex-wrap:wrap;
}
.tag {
  background:#f0f0f0;
  padding:4px 8px;
  border-radius:4px;
}
.done .task-title {
  text-decoration:line-through;
  color:#aaa;
}
.delete {
  border:0;
  background:transparent;
  color:#aaa;
  font-size:17px;
}
.form {
  background:white;
  padding:20px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:20px;
  display:none;
}
.form input, .form textarea, .form select {
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:6px;
  font:inherit;
}
.form textarea { min-height:85px; resize:vertical; }
.form label { font-size:12px; color:#777; }
.form-actions {
  display:flex;
  gap:8px;
  justify-content:flex-end;
}
.form-actions button {
  padding:10px 18px;
  border-radius:6px;
  border:1px solid #ddd;
}
.empty { color:#aaa; text-align:center; padding:45px 10px; }
@media(max-width:600px) {
  main { margin:22px auto; }
  .stats { gap:7px; }
  .stat { padding:12px; }
  .stat strong { font-size:21px; }
  .tab { padding:11px 13px; }
}
</style>
</head>
<body>

<header>
  <div class="top">
    <h2>📒 MY UNIVERSITY</h2>
    <span style="font-size:12px;color:#777">MY STUDY SPACE</span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <h1 id="pageTitle">전체 일정</h1>
  <div class="sub" id="subtitle">나의 대학 생활을 한눈에 관리하기</div>

  <div class="stats">
    <div class="stat">
      <strong id="todoCount">0</strong>
      <span>남은 일정</span>
    </div>
    <div class="stat">
      <strong id="weekCount">0</strong>
      <span>이번 주 일정</span>
    </div>
    <div class="stat">
      <strong id="doneCount">0</strong>
      <span>완료한 일정</span>
    </div>
  </div>

  <div class="form" id="form">
    <h3>새 일정 기록하기</h3>
    <label>제목</label>
    <input id="title" placeholder="예: 중간고사 과제 제출">

    <label>내용 / 메모</label>
    <textarea id="description" placeholder="해야 할 일, 교수님 공지, 시험 범위 등을 기록하세요."></textarea>

    <label>일정 종류</label>
    <select id="type">
      <option>과제</option>
      <option>시험</option>
      <option>공지</option>
      <option>개인 할 일</option>
      <option>기타</option>
    </select>

    <label>날짜</label>
    <input type="date" id="date">

    <div class="form-actions">
      <button onclick="closeForm()">취소</button>
      <button class="add-btn" onclick="saveTask()">저장하기</button>
    </div>
  </div>

  <div class="section-title">
    <h3 id="listTitle">다가오는 일정</h3>
    <button class="add-btn" onclick="openForm()">＋ 일정 추가</button>
  </div>

  <div id="taskList"></div>
</main>

<script>
const defaultSubjects = [
  "인적 자원 관리",
  "소비자 행동",
  "회계원리",
  "핀테크 개론"
];

let data;
try {
  data = JSON.parse(localStorage.getItem("universityNotes")) || {
    subjects: defaultSubjects,
    tasks: []
  };
} catch(e) {
  data = { subjects: defaultSubjects, tasks: [] };
}

let current = "전체 일정";

function saveData() {
  localStorage.setItem("universityNotes", JSON.stringify(data));
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";

  ["전체 일정", ...data.subjects].forEach(subject => {
    const btn = document.createElement("button");
    btn.className = "tab" + (current === subject ? " active" : "");
    btn.textContent = subject;
    btn.onclick = () => {
      current = subject;
      render();
    };
    tabs.appendChild(btn);
  });

  const add = document.createElement("button");
  add.className = "add-tab";
  add.textContent = "+";
  add.title = "과목 추가";
  add.onclick = addSubject;
  tabs.appendChild(add);
}

function addSubject() {
  const name = prompt("추가할 과목명을 입력하세요.");
  if (!name || !name.trim()) return;

  if (data.subjects.includes(name.trim())) {
    alert("이미 등록된 과목입니다.");
    return;
  }

  data.subjects.push(name.trim());
  saveData();
  current = name.trim();
  render();
}

function openForm() {
  document.getElementById("form").style.display = "block";
  document.getElementById("title").focus();
}

function closeForm() {
  document.getElementById("form").style.display = "none";
}

function saveTask() {
  const title = document.getElementById("title").value.trim();
  if (!title) {
    alert("제목을 입력해주세요.");
    return;
  }

  if (current === "전체 일정") {
    alert("먼저 과목 탭을 선택해주세요.");
    return;
  }

  data.tasks.push({
    id: Date.now(),
    subject: current,
    title,
    description: document.getElementById("description").value,
    type: document.getElementById("type").value,
    date: document.getElementById("date").value,
    done: false
  });

  saveData();
  document.getElementById("title").value = "";
  document.getElementById("description").value = "";
  document.getElementById("date").value = "";
  closeForm();
  render();
}

function toggleTask(id) {
  const task = data.tasks.find(t => t.id === id);
  if (task) task.done = !task.done;
  saveData();
  render();
}

function deleteTask(id) {
  if (!confirm("이 일정을 삭제할까요?")) return;
  data.tasks = data.tasks.filter(t => t.id !== id);
  saveData();
  render();
}

function render() {
  renderTabs();

  const all = current === "전체 일정"
    ? data.tasks
    : data.tasks.filter(t => t.subject === current);

  const sorted = [...all].sort((a,b) => {
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  const today = new Date();
  today.setHours(0,0,0,0);
  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + 7);

  const pending = all.filter(t => !t.done);
  document.getElementById("todoCount").textContent = pending.length;
  document.getElementById("doneCount").textContent =
    all.filter(t => t.done).length;
  document.getElementById("weekCount").textContent =
    pending.filter(t => {
      if (!t.date) return false;
      const d = new Date(t.date + "T00:00:00");
      return d >= today && d <= weekEnd;
    }).length;

  document.getElementById("pageTitle").textContent = current;
  document.getElementById("subtitle").textContent =
    current === "전체 일정"
      ? "모든 과목의 일정을 모아서 확인하세요."
      : current + " 관련 과제와 일정을 기록하세요.";

  document.getElementById("listTitle").textContent =
    current === "전체 일정" ? "전체 일정 목록" : "과목 일정 및 메모";

  const list = document.getElementById("taskList");
  list.innerHTML = "";

  if (!sorted.length) {
    list.innerHTML = '<div class="empty">아직 기록된 일정이 없습니다.<br>＋ 일정 추가를 눌러 첫 기록을 남겨보세요.</div>';
    return;
  }

  sorted.forEach(task => {
    const item = document.createElement("div");
    item.className = "task" + (task.done ? " done" : "");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = task.done;
    check.onchange = () => toggleTask(task.id);

    const content = document.createElement("div");
    content.className = "task-content";

    const title = document.createElement("div");
    title.className = "task-title";
    title.textContent = task.title;

    const desc = document.createElement("div");
    desc.className = "task-desc";
    desc.textContent = task.description;

    const meta = document.createElement("div");
    meta.className = "task-meta";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = task.type;

    meta.appendChild(tag);

    if (current === "전체 일정") {
      const subject = document.createElement("span");
      subject.textContent = task.subject;
      meta.appendChild(subject);
    }

    if (task.date) {
      const date = document.createElement("span");
      date.textContent = "📅 " + task.date;
      meta.appendChild(date);
    }

    content.append(title, desc, meta);

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "×";
    del.title = "삭제";
    del.onclick = () => deleteTask(task.id);

    item.append(check, content, del);
    list.appendChild(item);
  });
}

render();
</script>
</body>
</html>
